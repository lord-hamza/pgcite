[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcite"
version = "0.1.0"
description = "Hybrid-search RAG service on PostgreSQL + pgvector with reranking, cited answers and an evaluation gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "psycopg[binary,pool]>=3.3",
    "pgvector>=0.5",
    "numpy>=2.0",
    "fastembed>=0.9",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["pgcite*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
