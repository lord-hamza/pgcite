<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="358" viewBox="0 0 1040 358" role="img" aria-labelledby="t">
<title id="t">pgcite: asking a question over HTTP and getting a cited answer back</title>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}.c{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.c{animation:none}}</style>
<rect x="0.5" y="0.5" width="1039" height="357" rx="12" fill="#1d2021" stroke="#3c3836"/>
<path d="M0.5 12.5a12 12 0 0 1 12-12h1015a12 12 0 0 1 12 12v32h-1039z" fill="#282828"/>
<line x1="0.5" y1="44.5" x2="1039.5" y2="44.5" stroke="#3c3836"/>
<circle cx="24" cy="22" r="6" fill="#fb4934"/><circle cx="44" cy="22" r="6" fill="#fabd2f"/><circle cx="64" cy="22" r="6" fill="#b8bb26"/>
<rect x="88" y="8" width="131" height="37" rx="6" fill="#1d2021"/>
<text x="104" y="32" font-size="15" fill="#d5c4a1">zsh: pgcite</text>
<text x="40" y="88" font-size="19" xml:space="preserve"><tspan fill="#928374"># pgcite: cited answers from PostgreSQL + pgvector</tspan></text>
<text x="40" y="119" font-size="19" xml:space="preserve"><tspan fill="#b8bb26">$ </tspan><tspan fill="#ebdbb2">curl -s localhost:8000/ask -H </tspan><tspan fill="#b8bb26">'content-type: application/json'</tspan><tspan fill="#ebdbb2"> \</tspan></text>
<text x="40" y="150" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">    -d </tspan><tspan fill="#b8bb26">'{"question": "What is the default value of sync.batch_size?"}'</tspan></text>
<text x="40" y="181" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">{</tspan></text>
<text x="40" y="212" font-size="19" xml:space="preserve"><tspan fill="#83a598">  "answer"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#b8bb26">"The default sync.batch_size is 200 and the maximum is 500 </tspan><tspan fill="#fe8019">[1]</tspan><tspan fill="#b8bb26">..."</tspan><tspan fill="#ebdbb2">,</tspan></text>
<text x="40" y="243" font-size="19" xml:space="preserve"><tspan fill="#83a598">  "citations"</tspan><tspan fill="#ebdbb2">: [{</tspan><tspan fill="#83a598">"ref"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#d3869b">1</tspan><tspan fill="#ebdbb2">, </tspan><tspan fill="#83a598">"title"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#b8bb26">"Sync troubleshooting"</tspan><tspan fill="#ebdbb2">}, ...],</tspan></text>
<text x="40" y="274" font-size="19" xml:space="preserve"><tspan fill="#83a598">  "timings_ms"</tspan><tspan fill="#ebdbb2">: {</tspan><tspan fill="#83a598">"bm25"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#d3869b">36.22</tspan><tspan fill="#ebdbb2">, </tspan><tspan fill="#83a598">"vector"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#d3869b">3.3</tspan><tspan fill="#ebdbb2">, </tspan><tspan fill="#83a598">"rerank"</tspan><tspan fill="#ebdbb2">: </tspan><tspan fill="#d3869b">587.8</tspan><tspan fill="#ebdbb2">, ...}</tspan></text>
<text x="40" y="305" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">}</tspan></text>
</svg>
